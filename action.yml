name: Foster dependency check
description: Find malware, orphaned dependencies and security holes with no fix, and point to published drop-in patches.
author: Foster contributors
branding:
  icon: home
  color: orange

inputs:
  path:
    description: Directory containing the lockfile(s) to scan.
    default: "."
  recursive:
    description: Also scan lockfiles in subfolders (monorepos).
    default: "true"
  only-new:
    description: On pull requests, only check dependencies the PR adds or changes (compared with the base branch).
    default: "true"
  since:
    description: Git ref to compare against instead (overrides only-new). Empty = check everything.
    default: ""
  fail-on:
    description: "Fail the job at this level: none | malicious | patch-available | orphaned-vulnerable | unpatched | any. Known malware fails every level except none."
    default: orphaned-vulnerable
  include-staged:
    description: Also report patches that are reviewed but not yet released.
    default: "false"
  version:
    description: foster-oss version to run (npm dist-tag or exact version).
    default: latest
  comment:
    description: "Post (or update) a pull request comment with the report. Needs `pull-requests: write`."
    default: "false"
  sarif:
    description: "Upload findings to GitHub code scanning (Security tab). Needs `security-events: write`."
    default: "false"
  github-token:
    description: Token used for the pull request comment and the SARIF upload.
    default: ${{ github.token }}

outputs:
  report:
    description: Path of the markdown report.
    value: ${{ steps.scan.outputs.report }}
  exit-code:
    description: Exit code of the scan (1 when fail-on was reached).
    value: ${{ steps.scan.outputs.exit-code }}
  sarif:
    description: Path of the SARIF report.
    value: ${{ steps.scan.outputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: "22"

    - id: scan
      shell: bash
      env:
        FOSTER_PATH: ${{ inputs.path }}
        FOSTER_FAIL_ON: ${{ inputs.fail-on }}
        FOSTER_STAGED: ${{ inputs.include-staged }}
        FOSTER_VERSION: ${{ inputs.version }}
        FOSTER_RECURSIVE: ${{ inputs.recursive }}
        FOSTER_SINCE: ${{ inputs.since || (inputs.only-new == 'true' && github.event.pull_request.base.sha) || '' }}
      run: |
        report="$RUNNER_TEMP/foster-report.md"
        sarif="$RUNNER_TEMP/foster.sarif"
        flags=""
        if [ "$FOSTER_STAGED" = "true" ]; then flags="--include-staged"; fi
        if [ "$FOSTER_RECURSIVE" = "true" ]; then flags="$flags --recursive"; fi
        if [ -n "$FOSTER_SINCE" ]; then
          # actions/checkout is shallow by default: make sure the base commit is available
          git -C "$FOSTER_PATH" cat-file -e "$FOSTER_SINCE^{commit}" 2>/dev/null || git -C "$FOSTER_PATH" fetch --no-tags --depth=1 origin "$FOSTER_SINCE" || true
          flags="$flags --since $FOSTER_SINCE"
        fi
        set +e
        npx --yes "foster-oss@${FOSTER_VERSION}" scan "$FOSTER_PATH" --markdown $flags --fail-on "$FOSTER_FAIL_ON" --sarif "$sarif" > "$report"
        code=$?
        set -e
        cat "$report" >> "$GITHUB_STEP_SUMMARY"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        echo "sarif=$sarif" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" -gt 1 ]; then echo "::error::foster-oss failed to run (exit $code)"; exit "$code"; fi

    - if: inputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: foster
        token: ${{ inputs.github-token }}

    - if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v8
      env:
        FOSTER_REPORT: ${{ steps.scan.outputs.report }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const marker = "<!-- foster-report -->";
          const body = marker + "\n" + fs.readFileSync(process.env.FOSTER_REPORT, "utf8");
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const existing = comments.find((c) => c.body && c.body.startsWith(marker));
          if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });

    - if: steps.scan.outputs.exit-code == '1'
      shell: bash
      run: |
        echo "::error::Foster found dependencies at or above the '${{ inputs.fail-on }}' level. See the job summary."
        exit 1
