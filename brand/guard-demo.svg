<svg xmlns="http://www.w3.org/2000/svg" width="880" height="334" viewBox="0 0 880 334" role="img" aria-label="foster-oss guard blocking known malware (lodahs), a hallucinated name and an abandoned vulnerable package (request)">
  <title>foster-oss guard, real output</title>
  <rect width="880" height="334" rx="12" fill="#171513"/>
  <circle cx="24" cy="22" r="6" fill="#ef7a6f"/><circle cx="44" cy="22" r="6" fill="#e3a849"/><circle cx="64" cy="22" r="6" fill="#6fc08f"/>
  <text x="440" y="27" text-anchor="middle" fill="#8b867c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">foster-oss guard</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <text x="24" y="66" xml:space="preserve"><tspan fill="#8b867c"># an AI agent wants to run:</tspan></text>
  <text x="24" y="88" xml:space="preserve"><tspan fill="#ff8a4c">$ </tspan><tspan fill="#e6e1d7">npm install lodahs react-pdf-renderer-utils request</tspan></text>
  <text x="24" y="110" xml:space="preserve"></text>
  <text x="24" y="132" xml:space="preserve"><tspan fill="#ef7a6f">Foster guard blocked this install:</tspan></text>
  <text x="24" y="154" xml:space="preserve"><tspan fill="#8b867c">- </tspan><tspan fill="#ef7a6f">lodahs</tspan><tspan fill="#e6e1d7"> is known malware (MAL-2025-25502: Malicious code in lodahs).</tspan></text>
  <text x="24" y="176" xml:space="preserve"><tspan fill="#8b867c">  Do not install it. If it is already installed, remove it and rotate credentials.</tspan></text>
  <text x="24" y="198" xml:space="preserve"><tspan fill="#8b867c">- </tspan><tspan fill="#ef7a6f">react-pdf-renderer-utils</tspan><tspan fill="#e6e1d7"> does not exist on the registry. It may be a misspelled or</tspan></text>
  <text x="24" y="220" xml:space="preserve"><tspan fill="#8b867c">  hallucinated name; attackers register such names ("slopsquatting").</tspan></text>
  <text x="24" y="242" xml:space="preserve"><tspan fill="#8b867c">- </tspan><tspan fill="#ef7a6f">request</tspan><tspan fill="#e6e1d7"> has security advisories that no release fixes (GHSA-p8p7-x288-28g6);</tspan></text>
  <text x="24" y="264" xml:space="preserve"><tspan fill="#8b867c">  maintenance: dead. Maintained alternatives: </tspan><tspan fill="#6fc08f">fetch (built in), ofetch, ky</tspan></text>
  <text x="24" y="286" xml:space="preserve"></text>
  <text x="24" y="308" xml:space="preserve"><tspan fill="#8b867c"># the command never runs; the agent is told why and what to use instead</tspan></text>
  </g>
</svg>
