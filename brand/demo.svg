<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="618" viewBox="0 0 1100 618" role="img" aria-label="foster-oss scan and fix output">
  <title>foster-oss scan and fix, real output</title>
  <rect width="1100" height="618" rx="12" fill="#171513"/>
  <circle cx="24" cy="22" r="6" fill="#ef7a6f"/><circle cx="44" cy="22" r="6" fill="#e3a849"/><circle cx="64" cy="22" r="6" fill="#6fc08f"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <text x="24" y="66" xml:space="preserve"><tspan fill="#ff8a4c">$ </tspan><tspan fill="#e6e1d7">npx foster-oss scan my-app</tspan></text>
  <text x="24" y="87" xml:space="preserve"><tspan fill="#e6e1d7">Foster scan: my-app</tspan></text>
  <text x="24" y="108" xml:space="preserve"><tspan fill="#8b867c">Lockfiles: package-lock.json · 65 packages checked</tspan></text>
  <text x="24" y="129" xml:space="preserve"></text>
  <text x="24" y="150" xml:space="preserve"><tspan fill="#5fc4d8">PATCH READY    </tspan><tspan fill="#e6e1d7">extract-zip@2.0.1 [HIGH]</tspan></text>
  <text x="24" y="171" xml:space="preserve"><tspan fill="#e6e1d7">               drop-in patch @keep-lts/extract-zip@2.0.2 by Keep LTS fixes GHSA-7pqw-9j4j-h8q3, GHSA-jmr9-qjv8-65gv.</tspan></text>
  <text x="24" y="192" xml:space="preserve"><tspan fill="#5fc4d8">PATCH READY    </tspan><tspan fill="#e6e1d7">ip@2.0.1 [HIGH]</tspan><tspan fill="#8b867c"> (transitive, via socks)</tspan></text>
  <text x="24" y="213" xml:space="preserve"><tspan fill="#e6e1d7">               drop-in patch @keep-lts/ip@2.0.2 by Keep LTS fixes GHSA-2p57-rm9w-gvfp.</tspan></text>
  <text x="24" y="234" xml:space="preserve"><tspan fill="#c792ea">               fund: GitHub Sponsors: indutny (https://github.com/sponsors/indutny)</tspan></text>
  <text x="24" y="255" xml:space="preserve"><tspan fill="#ef7a6f">ORPHANED+VULN  </tspan><tspan fill="#e6e1d7">request@2.88.2 [MODERATE]</tspan></text>
  <text x="24" y="276" xml:space="preserve"><tspan fill="#e6e1d7">               1 advisory(ies) with no fix anywhere, and the package looks dead.</tspan></text>
  <text x="24" y="297" xml:space="preserve"><tspan fill="#6fc08f">               consider: fetch (built in), ofetch, ky (https://e18e.dev/docs/replacements/fetch.html)</tspan></text>
  <text x="24" y="318" xml:space="preserve"><tspan fill="#8b867c">UPGRADE        </tspan><tspan fill="#e6e1d7">form-data@2.3.3 [CRITICAL]</tspan><tspan fill="#8b867c"> (transitive, via unmaintained request)</tspan></text>
  <text x="24" y="339" xml:space="preserve"><tspan fill="#e6e1d7">               fixed upstream in 2.5.6.</tspan></text>
  <text x="24" y="360" xml:space="preserve"><tspan fill="#8b867c">UPGRADE        qs@6.5.5, tough-cookie@2.5.0, uuid@3.4.0 (transitive, via unmaintained request) …</tspan></text>
  <text x="24" y="381" xml:space="preserve"><tspan fill="#8b867c">ORPHANED       40 widely used dependencies nobody maintains, with no known vulnerability today</tspan></text>
  <text x="24" y="402" xml:space="preserve"></text>
  <text x="24" y="423" xml:space="preserve"><tspan fill="#e3a849">4 vulnerable packages come in only through request, which nobody maintains, so it will not move to the</tspan></text>
  <text x="24" y="444" xml:space="preserve"><tspan fill="#e3a849">fixed versions: replace request, or force the fixes with an npm override.</tspan></text>
  <text x="24" y="465" xml:space="preserve"></text>
  <text x="24" y="486" xml:space="preserve"><tspan fill="#e6e1d7">Summary: 2 patch available (1 direct) · 1 orphaned+vulnerable · 0 no fix yet · 4 upgrade (0 direct) · 40 orphaned (0 direct)</tspan></text>
  <text x="24" y="507" xml:space="preserve"></text>
  <text x="24" y="528" xml:space="preserve"><tspan fill="#ff8a4c">$ </tspan><tspan fill="#e6e1d7">npx foster-oss fix my-app</tspan></text>
  <text x="24" y="549" xml:space="preserve"><tspan fill="#e6e1d7">updated dependencies["extract-zip"]: 2.0.1 → npm:@keep-lts/extract-zip@2.0.2</tspan></text>
  <text x="24" y="570" xml:space="preserve"><tspan fill="#e6e1d7">updated overrides["ip@2.0.1"]: (none) → npm:@keep-lts/ip@2.0.2</tspan></text>
  <text x="24" y="591" xml:space="preserve"><tspan fill="#6fc08f">package.json updated. Now run `npm install` and your tests.</tspan></text>
  </g>
</svg>
