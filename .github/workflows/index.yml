name: Orphan Index

on:
  schedule:
    - cron: "17 3 * * 1" # every Monday 03:17 UTC
  workflow_dispatch:

# each job gets only what it needs
permissions: {}

concurrency:
  group: orphan-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the refreshed data
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build the index from ecosyste.ms
        run: npm run index:build
      - name: Commit refreshed data
        run: |
          git config user.name "foster-bot"
          git config user.email "foster-bot@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Orphan Index: weekly refresh $(date -u +%Y-%m-%d)"
            # main may have moved while the index was building
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
