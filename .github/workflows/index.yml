name: Orphan Index

on:
  schedule:
    - cron: "17 3 * * 1" # every Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: orphan-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build the index from ecosyste.ms
        run: npm run index:build
      - name: Commit refreshed data
        run: |
          git config user.name "foster-bot"
          git config user.email "foster-bot@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Orphan Index: weekly refresh $(date -u +%Y-%m-%d)"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
