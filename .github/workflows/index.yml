name: Orphan Index

on:
  schedule:
    - cron: "17 3 * * 1" # every Monday 03:17 UTC
  workflow_dispatch:

# each job gets only what it needs
permissions: {}

concurrency:
  group: orphan-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the refreshed data
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build the index from ecosyste.ms
        run: npm run index:build
      - name: Commit refreshed data
        run: |
          git config user.name "foster-bot"
          git config user.email "foster-bot@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Orphan Index: weekly refresh $(date -u +%Y-%m-%d)"
            # main may have moved while the index was building
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
