name: Release foster-oss

# Publishes the CLI to npm with provenance, using npm trusted publishing (OIDC): no npm token is stored.
# Configure it once at npmjs.com → foster-oss → Settings → Trusted publishers → GitHub Actions,
# repository foster-oss/foster, workflow release.yml, environment npm-release.

on:
  push:
    tags: ["v*.*.*"] # full versions only; the moving v0 tag is for the GitHub Action

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Publish (skipped if this version is already on npm)
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "foster-oss@$v" version >/dev/null 2>&1; then echo "foster-oss@$v is already published"; exit 0; fi
          npm publish --provenance --access public

  mcp-registry:
    # Lists the MCP server in the official MCP Registry (registry.modelcontextprotocol.io).
    # The registry checks that the npm package's "mcpName" matches server.json, so this runs after npm.
    needs: publish
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: server.json and package.json agree
        run: |
          v=$(node -p "require('./package.json').version")
          test "$(node -p "require('./server.json').version")" = "$v"
          test "$(node -p "require('./server.json').packages[0].version")" = "$v"
          test "$(node -p "require('./package.json').mcpName")" = "$(node -p "require('./server.json').name")"
      - name: Wait until this version is visible on npm
        run: |
          v=$(node -p "require('./package.json').version")
          for i in $(seq 1 60); do npm view "foster-oss@$v" mcpName >/dev/null 2>&1 && exit 0; sleep 20; done
          echo "foster-oss@$v is not visible on npm yet"; exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
