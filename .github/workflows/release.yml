name: Release foster-oss

# Publishes the CLI to npm with provenance, using npm trusted publishing (OIDC): no npm token is stored.
# Configure it once at npmjs.com → foster-oss → Settings → Trusted publishers → GitHub Actions,
# repository rekalnx/foster, workflow release.yml, environment npm-release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
