name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22", "24"]
        exclude:
          - os: windows-latest
            node: "20"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: CLI smoke test (offline)
        run: node dist/cli.js scan test/fixtures/npm-v3 --offline --include-staged

  guard-live:
    # Real malware against the real registries and OSV, no stubs: the unit tests stub the network, and a
    # change in how the pieces fit (0.8.3 asked about crossenv instead of blocking it) only shows here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Known malware is denied however it is reached
        shell: bash
        run: |
          set +e
          CLI="$PWD/dist/cli.js"
          check_guard() {
            want=$1; shift
            out=$(node "$CLI" guard "$@"); got=$?
            if [ "$got" != "$want" ]; then echo "::error::guard $* exited $got, expected $want"; echo "$out"; exit 1; fi
            echo "ok ($got): $*"
          }
          check_guard 1 "npm i crossenv"
          check_guard 1 "npx crossenv"
          check_guard 1 "npm exec crossenv"
          check_guard 1 "npm i @ctrl/tinycolor@4.1.1"
          check_guard 1 "npm i tc@npm:@ctrl/tinycolor@4.1.1"
          check_guard 1 "npm i ua-parser-js@0.7.29"
          check_guard 0 "npm i react lodash express"
          check_guard 10 "npm i https://example.com/x.tgz"
          d=$(mktemp -d)
          echo '{"name":"root","private":true,"workspaces":["apps/*"]}' > "$d/package.json"
          mkdir -p "$d/apps/a" && echo '{"name":"a","dependencies":{"crossenv":"0.0.2-security"}}' > "$d/apps/a/package.json"
          # a failure inside ( … ) only leaves the subshell: pass it on
          (cd "$d" && check_guard 1 "npm install" && check_guard 1 "npm install express" && check_guard 1 "corepack pnpm install" && check_guard 1 "corepack yarn install") || exit 1
          o=$(mktemp -d)
          echo '{"dependencies":{"express":"4.21.2"},"overrides":{"ms":"npm:crossenv@0.0.2-security"}}' > "$o/package.json"
          (cd "$o" && check_guard 1 "npm install") || exit 1
          echo '{"dependencies":{"express":"4.21.2"},"resolutions":{"**/ms":"npm:crossenv@0.0.2-security"}}' > "$o/package.json"
          (cd "$o" && check_guard 1 "yarn install") || exit 1
          echo '{"peerDependencies":{"crossenv":"0.0.2-security"}}' > "$o/package.json"
          (cd "$o" && check_guard 1 "npm install") || exit 1

  shells:
    # The package as users get it (npm pack, npm i -g), run from every shell agents use: npm's shims
    # differ per platform, and PowerShell drops "--" on the way into the .ps1 shim.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci && npm run build
      - name: Install the packed package globally
        shell: bash
        run: |
          npm pack --silent
          npm i -g ./foster-oss-*.tgz
          foster-oss --version
      - name: bash
        shell: bash
        run: |
          set +e
          cd "$RUNNER_TEMP"
          check() { want=$1; shift; foster-oss guard "$@" >/dev/null; got=$?; echo "bash ($got): $*"; [ "$got" = "$want" ] || { echo "::error::bash: guard $* exited $got, expected $want"; exit 1; }; }
          check 0 -- npm i -D vitest
          check 1 -- npm i crossenv
          check 10 -- npm i expres
          check 1 --strict -- npm i expres
          check 0 --command "cd web && npm install --save-dev typescript"
          check 0 --command "npm i react > out.log 2>&1"
          check 1 --command "bash -c \"npm i crossenv\""
          check 0 --command "go install golang.org/x/tools/cmd/goimports@latest"
          foster-oss check crossenv | grep -q MALWARE || { echo "::error::check did not name crossenv as malware"; exit 1; }
          foster-oss scan ./no-such-folder >/dev/null 2>&1; [ $? = 2 ] && echo "scan of a missing folder fails" || { echo "::error::scan of a missing folder did not fail"; exit 1; }
          foster-oss skill install . >/dev/null && test -f .claude/skills/foster/SKILL.md && test -f .agents/skills/foster/SKILL.md && grep -q "PowerShell(foster-oss guard \*)" .claude/settings.json && echo "skill install ok"
      - name: PowerShell
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          function Check($want) { $null = foster-oss guard @args; $got = $LASTEXITCODE; "pwsh ($got): $args"; if ($got -ne $want) { Write-Error "pwsh: guard $args exited $got, expected $want"; exit 1 } }
          Check 0 -- npm i -D vitest
          Check 1 -- npm i crossenv
          Check 10 -- npm i expres
          Check 0 --command "cd web && npm install --save-dev typescript"
          Check 0 --command "npm i react *> all.log"
          Check 1 --command "cmd /c npm i crossenv"
          $global:LASTEXITCODE = 0
      - name: Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-Location $env:RUNNER_TEMP
          $null = foster-oss guard -- npm i -D vitest; if ($LASTEXITCODE -ne 0) { exit 1 }
          $null = foster-oss guard -- npm i crossenv; if ($LASTEXITCODE -ne 1) { exit 1 }
          "powershell 5.1 ok"; exit 0
      - name: cmd
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd /d %RUNNER_TEMP%
          call foster-oss guard -- npm i -D vitest >nul
          if errorlevel 1 exit /b 1
          call foster-oss guard -- npm i crossenv >nul
          if not errorlevel 1 exit /b 1
          echo cmd ok
          exit /b 0

  patches:
    # Every patch is rebuilt from the upstream release and re-verified on every change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify all patches
        run: |
          set -e
          for meta in patches/*/*/foster.json; do
            dir=$(dirname "$meta")
            target=${dir#patches/}
            echo "::group::$target"
            node scripts/build-patch.mjs "$target"
            echo "::endgroup::"
          done
      - name: Registry entries are well-formed and match patch folders
        run: |
          node -e '
            const fs = require("fs");
            const semver = require("semver");
            const reg = JSON.parse(fs.readFileSync("registry/patches.json", "utf8"));
            let bad = 0;
            for (const p of reg.patches) {
              for (const k of ["ecosystem", "name", "affected", "status", "summary"]) if (!p[k]) { console.error(`${p.name}: missing ${k}`); bad++; }
              if (!p.replacement?.name || !p.replacement?.version) { console.error(`${p.name}: missing replacement`); bad++; }
              if (!Array.isArray(p.advisories) || p.advisories.length === 0) { console.error(`${p.name}: no advisories`); bad++; }
              if (p.ecosystem === "npm" && !semver.validRange(p.affected)) { console.error(`${p.name}: invalid affected range ${p.affected}`); bad++; }
              if (!p.patchDir && !p.provider) { console.error(`${p.name}: third-party entries need a provider`); bad++; }
              if (!p.patchDir) continue; // third-party patch: nothing in this repo to compare against
              const meta = JSON.parse(fs.readFileSync(p.patchDir + "/foster.json", "utf8"));
              for (const k of ["ecosystem", "name", "affected", "status"]) if (meta[k] !== p[k]) { console.error(`${p.name}: ${k} differs`); bad++; }
              if (meta.replacement.name !== p.replacement.name || meta.replacement.version !== p.replacement.version) { console.error(`${p.name}: replacement differs`); bad++; }
            }
            process.exit(bad ? 1 : 0);'

  action:
    # Runs action.yml itself (with the released foster-oss) on a fixture that has a known patch.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - id: foster
        uses: ./
        continue-on-error: true
        with:
          path: test/fixtures/npm-v3
          recursive: "false"
          only-new: "false"
          fail-on: patch-available
      - name: The action found the ip patch and failed the step
        env:
          OUTCOME: ${{ steps.foster.outcome }}
          CODE: ${{ steps.foster.outputs.exit-code }}
          REPORT: ${{ steps.foster.outputs.report }}
          SARIF: ${{ steps.foster.outputs.sarif }}
        run: |
          echo "outcome=$OUTCOME exit-code=$CODE"
          test "$OUTCOME" = failure
          test "$CODE" = 1
          grep -q "@keep-lts/ip" "$REPORT"
          node -e 'const s=JSON.parse(require("fs").readFileSync(process.env.SARIF,"utf8")); if (!s.runs[0].results.length) process.exit(1)'

  dogfood:
    # Foster scans itself, and its findings show up in this repository's Security tab.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci && npm run build
      - run: node dist/cli.js scan . --markdown --summary-file "$GITHUB_STEP_SUMMARY" --sarif foster.sarif --fail-on orphaned-vulnerable
      - if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: foster.sarif
          category: foster
