name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22", "24"]
        exclude:
          - os: windows-latest
            node: "20"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: CLI smoke test (offline)
        run: node dist/cli.js scan test/fixtures/npm-v3 --offline --include-staged

  guard-live:
    # Real malware against the real registries and OSV, no stubs: the unit tests stub the network, and a
    # change in how the pieces fit (0.8.3 asked about crossenv instead of blocking it) only shows here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Known malware is denied however it is reached
        shell: bash
        run: |
          set +e
          CLI="$PWD/dist/cli.js"
          check_guard() {
            want=$1; shift
            out=$(node "$CLI" guard "$@"); got=$?
            if [ "$got" != "$want" ]; then echo "::error::guard $* exited $got, expected $want"; echo "$out"; exit 1; fi
            echo "ok ($got): $*"
          }
          check_guard 1 "npm i crossenv"
          check_guard 1 "npx crossenv"
          check_guard 1 "npm exec crossenv"
          check_guard 1 "npm i @ctrl/tinycolor@4.1.1"
          check_guard 1 "npm i tc@npm:@ctrl/tinycolor@4.1.1"
          check_guard 1 "npm i ua-parser-js@0.7.29"
          check_guard 0 "npm i react lodash express"
          check_guard 10 "npm i https://example.com/x.tgz"
          d=$(mktemp -d)
          echo '{"name":"root","private":true,"workspaces":["apps/*"]}' > "$d/package.json"
          mkdir -p "$d/apps/a" && echo '{"name":"a","dependencies":{"crossenv":"0.0.2-security"}}' > "$d/apps/a/package.json"
          (cd "$d" && check_guard 1 "npm install" && check_guard 1 "npm install express")

  patches:
    # Every patch is rebuilt from the upstream release and re-verified on every change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify all patches
        run: |
          set -e
          for meta in patches/*/*/foster.json; do
            dir=$(dirname "$meta")
            target=${dir#patches/}
            echo "::group::$target"
            node scripts/build-patch.mjs "$target"
            echo "::endgroup::"
          done
      - name: Registry entries are well-formed and match patch folders
        run: |
          node -e '
            const fs = require("fs");
            const semver = require("semver");
            const reg = JSON.parse(fs.readFileSync("registry/patches.json", "utf8"));
            let bad = 0;
            for (const p of reg.patches) {
              for (const k of ["ecosystem", "name", "affected", "status", "summary"]) if (!p[k]) { console.error(`${p.name}: missing ${k}`); bad++; }
              if (!p.replacement?.name || !p.replacement?.version) { console.error(`${p.name}: missing replacement`); bad++; }
              if (!Array.isArray(p.advisories) || p.advisories.length === 0) { console.error(`${p.name}: no advisories`); bad++; }
              if (p.ecosystem === "npm" && !semver.validRange(p.affected)) { console.error(`${p.name}: invalid affected range ${p.affected}`); bad++; }
              if (!p.patchDir && !p.provider) { console.error(`${p.name}: third-party entries need a provider`); bad++; }
              if (!p.patchDir) continue; // third-party patch: nothing in this repo to compare against
              const meta = JSON.parse(fs.readFileSync(p.patchDir + "/foster.json", "utf8"));
              for (const k of ["ecosystem", "name", "affected", "status"]) if (meta[k] !== p[k]) { console.error(`${p.name}: ${k} differs`); bad++; }
              if (meta.replacement.name !== p.replacement.name || meta.replacement.version !== p.replacement.version) { console.error(`${p.name}: replacement differs`); bad++; }
            }
            process.exit(bad ? 1 : 0);'

  action:
    # Runs action.yml itself (with the released foster-oss) on a fixture that has a known patch.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - id: foster
        uses: ./
        continue-on-error: true
        with:
          path: test/fixtures/npm-v3
          recursive: "false"
          only-new: "false"
          fail-on: patch-available
      - name: The action found the ip patch and failed the step
        env:
          OUTCOME: ${{ steps.foster.outcome }}
          CODE: ${{ steps.foster.outputs.exit-code }}
          REPORT: ${{ steps.foster.outputs.report }}
          SARIF: ${{ steps.foster.outputs.sarif }}
        run: |
          echo "outcome=$OUTCOME exit-code=$CODE"
          test "$OUTCOME" = failure
          test "$CODE" = 1
          grep -q "@keep-lts/ip" "$REPORT"
          node -e 'const s=JSON.parse(require("fs").readFileSync(process.env.SARIF,"utf8")); if (!s.runs[0].results.length) process.exit(1)'

  dogfood:
    # Foster scans itself, and its findings show up in this repository's Security tab.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci && npm run build
      - run: node dist/cli.js scan . --markdown --summary-file "$GITHUB_STEP_SUMMARY" --sarif foster.sarif --fail-on orphaned-vulnerable
      - if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: foster.sarif
          category: foster
