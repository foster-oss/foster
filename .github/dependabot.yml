version: 2
updates:
  # Actions are pinned to commit SHAs; this keeps the pins (and their version comments) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
      dependencies:
        dependency-type: production
    open-pull-requests-limit: 3
